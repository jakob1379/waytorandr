name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        if: ${{ !env.ACT }}
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: Enable Nix cache
        if: ${{ !env.ACT }}
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39

      - name: Cache Cargo artifacts
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: .
          prefix-key: ${{ runner.os }}-nix
          shared-key: ci
          cache-on-failure: true
          cache-all-crates: true
          cmd-format: nix develop -c cargo {0}

      - name: Run canonical checks
        run: nix develop -c just check

  package:
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify release tag matches Cargo workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-version.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39

      - name: Build package
        run: |
          set -euo pipefail

          if [ -n "${ACT:-}" ]; then
            export CARGO_BUILD_JOBS=1
            nix build --option sandbox false --max-jobs 1 --cores 1
          else
            nix build
          fi

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          nix build .#deb --out-link result-deb
          nix build .#apk --out-link result-apk
          nix build .#aut --out-link result-aut
          nix build .#aur --out-link result-aur
          nix build .#rpm --out-link result-rpm
          nix build .#flatpak --out-link result-flatpak
          nix build .#snap --out-link result-snap

          tar -C result/bin -czf "dist/waytorandr-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" waytorandr waytorandrd

          cp result-deb/*.deb dist/
          cp result-apk/*.apk dist/
          cp result-aut/*.pkg.tar.zst dist/
          cp result-rpm/*.rpm dist/
          cp result-flatpak/*.flatpak dist/
          cp result-snap/*.snap dist/
          cp result-aur/PKGBUILD "dist/waytorandr-${GITHUB_REF_NAME}-PKGBUILD"
          cp result-aur/.SRCINFO "dist/waytorandr-${GITHUB_REF_NAME}.SRCINFO"

          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
          generate_release_notes: true
