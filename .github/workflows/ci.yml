name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: ${{ runner.os }}-nix
          shared-key: ci
          cache-on-failure: true
          cache-all-crates: true
          cmd-format: nix develop -c cargo {0}

      - name: Run clippy
        run: nix develop -c cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Scan for dead code
        run: env RUSTFLAGS='-Ddead_code' nix develop -c cargo check --locked --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: ${{ runner.os }}-nix
          shared-key: ci
          cache-on-failure: true
          cache-all-crates: true
          cmd-format: nix develop -c cargo {0}

      - name: Run tests
        run: nix develop -c cargo test --locked --workspace

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify release tag matches Cargo workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-version.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build package
        run: |
          set -euo pipefail

          if [ -n "${ACT:-}" ]; then
            export CARGO_BUILD_JOBS=1
            nix build --option sandbox false --max-jobs 1 --cores 1
          else
            nix build
          fi

      - name: Package release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p dist

          nix build .#deb --out-link result-deb
          nix build .#apk --out-link result-apk
          nix build .#aut --out-link result-aut
          nix build .#aur --out-link result-aur
          nix build .#rpm --out-link result-rpm
          nix build .#flatpak --out-link result-flatpak
          nix build .#snap --out-link result-snap

          tar -C result/bin -czf "dist/waytorandr-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" waytorandr waytorandrd

          cp result-deb/*.deb dist/
          cp result-apk/*.apk dist/
          cp result-aut/*.pkg.tar.zst dist/
          cp result-rpm/*.rpm dist/
          cp result-flatpak/*.flatpak dist/
          cp result-snap/*.snap dist/
          cp result-aur/PKGBUILD "dist/waytorandr-${GITHUB_REF_NAME}-PKGBUILD"
          cp result-aur/.SRCINFO "dist/waytorandr-${GITHUB_REF_NAME}.SRCINFO"

          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
