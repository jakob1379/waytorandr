[workspace]
resolver = "2"
members = [
  "crates/backend-loader",
  "crates/core",
  "crates/gnome",
  "crates/kscreen",
  "crates/wlroots",
  "bin/waytorandr",
  "bin/waytorandrd",
]
default-members = [
  "bin/waytorandr",
  "bin/waytorandrd",
]

[workspace.package]
version = "0.3.11"
edition = "2021"
authors = ["waytorandr contributors"]
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/jakob1379/waytorandr"

[workspace.dependencies]
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
anyhow = "1.0"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
directories = "6.0"
zbus = "5.15"

[profile.dev]
debug = 1
