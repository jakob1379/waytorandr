[package]
name = "waytorandr-backend-loader"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend selection and session detection for waytorandr"
repository.workspace = true
readme = "../../README.md"
keywords = ["wayland", "display", "profiles", "randr", "monitor"]
categories = ["command-line-utilities", "config"]

[features]
default = ["all-backends"]
all-backends = ["gnome", "kscreen", "wlroots"]
gnome = ["dep:waytorandr-gnome"]
kscreen = ["dep:waytorandr-kscreen"]
wlroots = ["dep:waytorandr-wlroots"]
test-backend = ["dep:serde", "dep:serde_json"]

[dependencies]
waytorandr-core = { path = "../core" }
waytorandr-gnome = { path = "../gnome", optional = true }
waytorandr-kscreen = { path = "../kscreen", optional = true }
waytorandr-wlroots = { path = "../wlroots", optional = true }
anyhow.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
