[package]
name = "waytorandrd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "User daemon for automatically applying waytorandr display profiles"
repository.workspace = true
readme = "../../README.md"
keywords = ["wayland", "display", "profiles", "randr", "monitor"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "waytorandrd"
path = "src/main.rs"

[dependencies]
waytorandr-backend-loader = { path = "../../crates/backend-loader" }
waytorandr-core = { path = "../../crates/core" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
